name: Publish colors package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test colors package
        run: yarn workspace @suzycss/colors test

      - name: Publish colors package
        run: npm publish ./packages/colors --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
